[package]
name = "astrobonk"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18.1", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
bevy_replicon = "0.40.0"

# Playable dev builds: our code light-opt, dependencies fully optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
